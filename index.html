<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximamente | The Legacy Method™</title>
<meta name="description" content="Algo nuevo está en camino.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --noir:  #180F09;
  --gold:  #C69A5C;
  --ivory: #F6ECDA;
  --font-d: 'Playfair Display','Georgia',serif;
  --font-b: 'Inter','Helvetica Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--noir);
  color:var(--ivory);
  font-family:var(--font-b);
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.glow{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 60% 55% at 50% 42%, rgba(198,154,92,.08) 0%, transparent 65%);
  pointer-events:none;
}
.wrap{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:32px;
  opacity:0;transform:translateY(14px);
  animation:rise 1.1s cubic-bezier(.16,1,.3,1) .15s forwards;
}
@keyframes rise{to{opacity:1;transform:none;}}

.mark{
  width:96px;margin-bottom:44px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 68%,transparent 92%);
  mask-image:radial-gradient(circle at 50% 50%,#000 68%,transparent 92%);
}
.mark img{width:100%;height:auto;display:block;}

.eyebrow{
  font-family:var(--font-b);font-size:11px;font-weight:600;letter-spacing:.5em;text-transform:uppercase;
  color:rgba(246,236,218,.34);margin-bottom:28px;
}
h1{
  font-family:var(--font-d);font-weight:700;font-style:italic;
  font-size:clamp(30px,6vw,54px);
  line-height:1.25;letter-spacing:-.3px;
  color:rgba(246,236,218,.96);
  max-width:14ch;
}
.rule{width:40px;height:1px;background:var(--gold);margin:38px 0;}
p.sub{
  font-family:var(--font-b);font-size:13px;font-weight:500;letter-spacing:.06em;
  color:rgba(246,236,218,.38);max-width:34ch;line-height:1.7;
}

@media (max-width:520px){
  .mark{width:76px;margin-bottom:34px;}
  .eyebrow{letter-spacing:.38em;font-size:10px;margin-bottom:22px;}
  .rule{margin:30px 0;}
}
@media (prefers-reduced-motion:reduce){
  .wrap{opacity:1;transform:none;animation:none;}
}
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <div class="mark"><img src="assets/lindsy-seal.png" alt="Lindsy Torres"></div>
    <p class="eyebrow">The Legacy Method™</p>
    <h1>Algo nuevo<br>está en camino.</h1>
    <div class="rule"></div>
    <p class="sub">Próximamente.</p>
  </div>
</body>
</html>
